<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul and Maggie's Wedding RSVP</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #faf9f8;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 100%;
            padding: 20px;
            text-align: center;
        }

        .wedding-image {
            max-width: 100%;
            height: auto;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .rsvp-button {
            background-color: #8b4513;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .rsvp-button:hover {
            background-color: #6b3410;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/invite.jpg" alt="Wedding Invitation" class="wedding-image">
        <a href="https://invite.paulandmaggie.com" class="rsvp-button">
            RSVP Now
        </a>
    </div>
</body>
</html>
